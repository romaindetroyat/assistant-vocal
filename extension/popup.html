<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Assistant vocal</title>
  <style>
    body { margin: 0; padding: 10px; width: 220px; font: 14px system-ui, sans-serif; background: #111827; color: #f9fafb; }
    button { display: block; width: 100%; margin: 0 0 8px; padding: 10px 12px; border: 0; border-radius: 10px; font: inherit; cursor: pointer; text-align: left; background: #1f2937; color: inherit; }
    button:hover { background: #374151; }
    button.primaire { background: #2563eb; font-weight: 600; }
    button.primaire:hover { background: #1d4ed8; }
    small { color: #9ca3af; display: block; margin-top: 2px; font-size: 11px; }
    a { color: #93c5fd; font-size: 12px; }
    #etat { min-height: 16px; font-size: 12px; color: #9ca3af; }
  </style>
</head>
<body>
  <button id="parler" class="primaire" type="button">🎙️ Parler<small>Ouvre l'assistant et lance l'écoute</small></button>
  <button id="ouvrir" type="button">Ouvrir l'assistant<small>Fenêtre dédiée</small></button>
  <button id="envoyer-page" type="button">Envoyer la page<small>Texte de l'onglet courant</small></button>
  <div id="etat"></div>
  <a href="#" id="options">Options (hôte, jeton, raccourcis)</a>
  <script src="popup.js" type="module"></script>
</body>
</html>
