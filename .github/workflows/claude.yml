name: Claude Code
# Claude Code implémente les issues et répond aux commentaires qui le mentionnent (@claude), puis ouvre la pull request.
on:
  issues:
    types: [opened, assigned]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
jobs:
  claude:
    if: |
      github.actor != 'claude[bot]' && (
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: --allowedTools "Bash(npm ci),Bash(npm install),Bash(npm test),Bash(npm run:*),Bash(node:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(git:*),Read,Edit,Write,Glob,Grep,WebFetch"
      # Filet de sécurité : si Claude a poussé une branche sans ouvrir la pull request, on l'ouvre ici.
      - name: Ouvrir la pull request si nécessaire
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMERO: ${{ github.event.issue.number }}
          TITRE: ${{ github.event.issue.title }}
        run: |
          git fetch origin --prune
          BRANCHE=$(git branch -r --list "origin/claude/issue-${NUMERO}-*" | sed 's#.*origin/##' | sort | tail -n1)
          if [ -z "$BRANCHE" ]; then echo "Aucune branche poussée"; exit 0; fi
          if [ -n "$(gh pr list --head "$BRANCHE" --state open --json number --jq '.[0].number')" ]; then echo "PR déjà ouverte"; exit 0; fi
          gh pr create --base main --head "$BRANCHE" --title "$TITRE" --body "Closes #${NUMERO}

          Implémenté par Claude Code à partir de la demande transmise par l'assistant vocal. Détails dans l'issue."
