name: Déployer sur Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      JETON_PRESENT: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Vérifier la présence du jeton Cloudflare
        run: |
          if [ "$JETON_PRESENT" != "true" ]; then echo "::warning::Secret CLOUDFLARE_API_TOKEN absent : déploiement ignoré"; fi
      - uses: actions/checkout@v4
        if: env.JETON_PRESENT == 'true'
      - uses: actions/setup-node@v4
        if: env.JETON_PRESENT == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: env.JETON_PRESENT == 'true'
      - run: node scripts/inline-assets.mjs
        if: env.JETON_PRESENT == 'true'
      - name: Déployer le Worker
        if: env.JETON_PRESENT == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Pousser les secrets du Worker (ceux définis dans GitHub)
        if: env.JETON_PRESENT == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN_ASSISTANT: ${{ secrets.GH_TOKEN_ASSISTANT }}
          ASSISTANT_PASSWORD: ${{ secrets.ASSISTANT_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          MCP_CONFIG_JSON: ${{ secrets.MCP_CONFIG_JSON }}
          TRANSCRIBE_URL: ${{ secrets.TRANSCRIBE_URL }}
          TRANSCRIBE_API_KEY: ${{ secrets.TRANSCRIBE_API_KEY }}
          TRANSCRIBE_MODEL: ${{ secrets.TRANSCRIBE_MODEL }}
        run: |
          node -e '
            const noms = ["ANTHROPIC_API_KEY","ANTHROPIC_WORKSPACE_ID","OPENAI_API_KEY","ASSISTANT_PASSWORD","SESSION_SECRET","VAPID_PUBLIC_KEY","VAPID_PRIVATE_KEY","MCP_CONFIG_JSON","TRANSCRIBE_URL","TRANSCRIBE_API_KEY","TRANSCRIBE_MODEL"];
            const secrets = Object.fromEntries(noms.filter((n) => process.env[n]).map((n) => [n, process.env[n]]));
            if (process.env.GH_TOKEN_ASSISTANT) secrets.GITHUB_TOKEN = process.env.GH_TOKEN_ASSISTANT; // GitHub interdit les secrets nommés GITHUB_*
            require("fs").writeFileSync("secrets.json", JSON.stringify(secrets));
            console.log("Secrets poussés :", Object.keys(secrets).join(", ") || "(aucun)");
          '
          npx wrangler secret bulk secrets.json
          rm -f secrets.json
